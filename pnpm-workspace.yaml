# ponytail: pnpm v11 — packages that need to run their postinstall scripts.
# No "packages" field → pnpm does not treat this as a workspace config,
# so "--ignore-workspace" on the install command still works.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
